name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run — no point burning minutes on a
# commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - run: npx tsc --noEmit
      - run: npm run lint
      # env.ts validates at import time and the tests import it, so CI needs a valid-shaped
      # environment. These are throwaway values that never touch a real database.
      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?connection_limit=5
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
          JWT_SECRET: ci-only-secret-value-at-least-32-chars-long
          CORS_ORIGIN: http://localhost:3000
          NODE_ENV: test

  frontend:
    name: frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
  
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: backend — docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, no push: this exists to catch a Dockerfile that cannot produce an image,
      # which is precisely the failure the previous Dockerfile shipped with.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
